[project]
name = "atlas-botanico-peru"
version = "0.1.0"
description = "Atlas Botanico del Peru — ETL reproducible (WCVP/IPNI/GBIF/Tree of Life) + capa analitica + dashboards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
dependencies = [
    # ETL / datos
    "duckdb>=1.1",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "requests>=2.32",
    "python-dotenv>=1.0",
    # APIs Kew / GBIF
    "pykew>=0.1.3",
    "pygbif>=0.6.4",
    # Filogenia (Newick)
    "dendropy>=5.0",
    # Analitica / estadistica
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    # Geo (puntos -> departamento)
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "jupyterlab>=4.2",
]

[project.scripts]
atlas = "etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[tool.ruff]
line-length = 100
target-version = "py311"
